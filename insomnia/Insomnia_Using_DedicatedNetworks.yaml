  - name: (QoD) QoS Sessions
    meta:
      id: fld_3b1aecc55a984f9981bf3cfd453427a6
      created: 1778690493500
      modified: 1778690676068
      sortKey: -1778661277468.25
      description: Manage QoS sessions
    children:
      - url: "{{ _.base_url }}/sessions"
        name: Creates a new session
        meta:
          id: req_7c794f36182447cb9fb4df340732d1a1
          created: 1778690493502
          modified: 1778691023498
          isPrivate: false
          description: >
            Create QoS Session to manage latency/throughput priorities


            If the qosStatus in the API response is "AVAILABLE" and a
            notification callback is provided the API consumer will receive in
            addition to the response a

            `QOS_STATUS_CHANGED` event notification with `qosStatus` as
            `AVAILABLE`.


            If the `qosStatus` in the API response is `REQUESTED`, the client
            will receive either

            - a `QOS_STATUS_CHANGED` event notification with `qosStatus` as
            `AVAILABLE` after the network notifies that it has created the
            requested session, or

            - a `QOS_STATUS_CHANGED` event notification with `qosStatus` as
            `UNAVAILABLE` and `statusInfo` as `NETWORK_TERMINATED` after the
            network notifies that it has failed to provide the requested
            session.


            A `QOS_STATUS_CHANGED` event notification with `qosStatus` as
